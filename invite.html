<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RoadBook — Convite</title>
  <meta name="theme-color" content="#f7f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RoadBook">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="css/design.css">
  <style>
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100dvh; padding: 24px;
    }
    .invite-wrap {
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }
    .invite-logo { display: flex; align-items: center; gap: 7px; margin-bottom: 32px; }
    .invite-logo-road { font-family: var(--font-display); font-size: 22px; letter-spacing: 1px; color: var(--text); line-height: 1; }
    .invite-logo-dot  { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); flex-shrink: 0; }
    .invite-logo-book { font-family: var(--font-display); font-size: 22px; letter-spacing: 1px; color: var(--coral); line-height: 1; }
    .invite-card {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px;
    }
    .invite-band-color { height: 5px; border-radius: 3px; width: 100%; margin-bottom: 4px; }
    .invite-icon { text-align: center; display:flex; align-items:center; justify-content:center; color: var(--blue); }
    .invite-heading { font-family: var(--font-display); font-size: 26px; letter-spacing: 2px; text-align: center; white-space: pre-line; }
    .invite-meta { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.7; }
    .invite-band-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px;
      font-size: 13px; font-weight: 700; color: var(--text);
      margin: 0 auto;
    }
    .invite-band-dot { width: 10px; height: 10px; border-radius: 50%; }
    .role-pill {
      background: rgba(34,89,224,0.1); border: 1px solid rgba(34,89,224,0.2);
      border-radius: 20px; padding: 4px 12px;
      font-size: 11px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px;
      margin: 0 auto; display: inline-block;
    }
    /* Error / success states */
    .state-error, .state-success {
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .state-icon  { display:flex; align-items:center; justify-content:center; }
    .state-error .state-icon { color: var(--coral); }
    .state-success .state-icon { color: var(--confirm); }
    .state-title { font-family: var(--font-display); font-size: 26px; letter-spacing: 2px; white-space: pre-line; }
    .state-sub   { font-size: 14px; color: var(--muted); line-height: 1.65; }

    /* Lang toggle position */
    .lang-wrap {
      position: fixed; top: 16px; right: 16px; z-index: 200;
    }
  </style>
</head>
<body>

  <div class="lang-wrap">
    <button class="rb-lang-toggle" onclick="window._toggleLang()">PT</button>
  </div>

  <div class="invite-wrap">
    <div class="invite-logo">
      <span class="invite-logo-road">ROAD</span>
      <span class="invite-logo-dot"></span>
      <span class="invite-logo-book">BOOK</span>
    </div>

    <!-- Loading state -->
    <div id="state-loading" style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div class="spinner" style="width:32px;height:32px;"></div>
      <p style="font-size:13px;color:var(--muted);" data-i18n="inv.loading">A verificar convite...</p>
    </div>

    <!-- Invalid / expired state -->
    <div id="state-invalid" style="display:none;" class="invite-card">
      <div class="state-error">
        <div class="state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <div class="state-title" data-i18n="inv.invalid.title">CONVITE
INVÁLIDO</div>
        <div class="state-sub" data-i18n="inv.invalid.sub">Este convite não é válido ou já expirou. Pede ao administrador um novo link.</div>
      </div>
    </div>

    <!-- Main invite card -->
    <div id="state-invite" style="display:none;" class="invite-card">
      <div class="invite-band-color" id="inv-color"></div>
      <div class="invite-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></div>
      <div class="invite-heading" data-i18n="inv.heading">FOSTE
CONVIDADO</div>
      <div class="invite-band-pill">
        <div class="invite-band-dot" id="inv-dot"></div>
        <span id="inv-band-name">—</span>
      </div>
      <div class="role-pill" id="inv-role">Membro</div>
      <div class="invite-meta" id="inv-meta">—</div>
      <div class="auth-error" id="inv-error" style="display:none;"></div>

      <!-- Not logged in -->
      <div id="inv-auth-required" style="display:none;flex-direction:column;gap:10px;">
        <p style="font-size:13px;color:var(--muted);text-align:center;" data-i18n="inv.noauth.desc">Para aceitar o convite precisas de ter uma conta RoadBook.</p>
        <button class="btn btn-primary" onclick="loginAndAccept()" data-i18n="inv.btn.login">Entrar e aceitar</button>
        <button class="btn btn-outline" onclick="signupAndAccept()" data-i18n="inv.btn.signup">Criar conta</button>
      </div>

      <!-- Logged in -->
      <div id="inv-accept-btn-wrap" style="display:none;">
        <button class="btn btn-primary" id="inv-accept-btn" onclick="acceptInvite()" data-i18n="inv.btn.accept">Aceitar convite</button>
      </div>
    </div>

    <!-- Already accepted / success -->
    <div id="state-success" style="display:none;" class="invite-card">
      <div class="state-success">
        <div class="state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="state-title" data-i18n="inv.success.title">BEM-VINDO
À EQUIPA</div>
        <div class="state-sub" id="success-msg" data-i18n="inv.success.default">Já fazes parte da banda. Abre a app para começar.</div>
        <a href="/app.html" class="btn btn-primary mt-16" data-i18n="inv.btn.app">Ir para a app</a>
      </div>
    </div>

  </div>

  <script type="module">
    import { supabase, getUser } from './js/config.js';
    import { t, toggleLang } from './js/i18n.js';

    window._toggleLang = () => { toggleLang(); location.reload(); };

    const token = new URLSearchParams(window.location.search).get('token');
    let invitation = null;
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', async () => {
      if (!token) { show('state-invalid'); return; }

      // Fetch invitation
      const { data, error } = await supabase
        .from('invitations')
        .select('*, artists(name, color), accounts(name)')
        .eq('token', token)
        .single();

      if (error || !data) { show('state-invalid'); return; }

      const now = new Date();
      if (data.status !== 'pending' || new Date(data.expires_at) < now) {
        show('state-invalid'); return;
      }

      invitation = data;

      // Render card
      const color = data.artists?.color || '#2259e0';
      document.getElementById('inv-color').style.background   = color;
      document.getElementById('inv-dot').style.background     = color;
      document.getElementById('inv-band-name').textContent    = data.artists?.name || '—';
      document.getElementById('inv-role').textContent         = t('role.' + data.role) || data.role;
      document.getElementById('inv-meta').innerHTML =
        t('inv.valid.until', { date: `<strong>${new Date(data.expires_at).toLocaleDateString()}</strong>` });

      // Check session
      currentUser = await getUser();

      if (currentUser) {
        document.getElementById('inv-accept-btn-wrap').style.display = 'block';
      } else {
        document.getElementById('inv-auth-required').style.display = 'flex';
      }

      show('state-invite');
    });

    /* ── Accept ── */
    window.acceptInvite = async function() {
      const btn = document.getElementById('inv-accept-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-color:#ffffff55;border-top-color:#fff"></div>';

      const { data, error } = await supabase.rpc('accept_invitation', { p_token: token });

      if (error || data?.error) {
        const msg = data?.error || error?.message || t('common.error');
        const errEl = document.getElementById('inv-error');
        errEl.textContent = msg; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = t('inv.btn.accept');
        return;
      }

      // Check if profile has account_id — if not, set it
      if (currentUser && invitation?.account_id) {
        const { data: profile } = await supabase.from('profiles').select('account_id').eq('id', currentUser.id).single();
        if (!profile?.account_id) {
          await supabase.from('profiles').update({ account_id: invitation.account_id }).eq('id', currentUser.id);
        }
      }

      const bandName = invitation?.artists?.name;
      document.getElementById('success-msg').textContent = bandName
        ? `${t('inv.success.default').replace('da banda', `de ${bandName}`)}`
        : t('inv.success.default');
      document.getElementById('success-msg').removeAttribute('data-i18n');
      show('state-success');
    };

    /* ── Auth redirects (preserve token in URL) ── */
    window.loginAndAccept = function() {
      window.location.href = `/index.html?next=${encodeURIComponent(window.location.href)}`;
    };
    window.signupAndAccept = function() {
      window.location.href = `/index.html?mode=signup&next=${encodeURIComponent(window.location.href)}`;
    };

    /* ── Utils ── */
    function show(id) {
      ['state-loading','state-invalid','state-invite','state-success'].forEach(s => {
        const el = document.getElementById(s);
        if (s === id) {
          el.style.display = s === 'state-invite' ? 'flex' : s === 'state-loading' ? 'flex' : 'block';
        } else {
          el.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
